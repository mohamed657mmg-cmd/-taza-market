
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طازة ماركت</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f9f6;
      color: #26352a;
      padding-bottom: 82px;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px;
      background: #fff;
    }

    .logo {
      color: #16813a;
      font-size: 25px;
      font-weight: 900;
    }

    .logo span {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #16813a;
      color: white;
      font-size: 19px;
      margin-left: 5px;
    }

    .header-btn {
      border: 0;
      background: #f0f7ef;
      color: #16813a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 19px;
    }

    .location {
      padding: 0 17px 12px;
      font-size: 12px;
      color: #718075;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 17px 17px;
      padding: 12px 14px;
      border: 1px solid #e7ece6;
      border-radius: 13px;
      background: #f8faf7;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font-size: 13px;
    }

    .banner {
      margin: 0 17px 23px;
      min-height: 155px;
      border-radius: 18px;
      padding: 20px;
      color: white;
      background: linear-gradient(120deg, #075526, #259c4a);
      overflow: hidden;
      position: relative;
    }

    .banner h1 {
      font-size: 23px;
      line-height: 1.6;
      margin-bottom: 5px;
    }

    .banner p {
      font-size: 12px;
      margin-bottom: 15px;
    }

    .banner button {
      border: 0;
      border-radius: 9px;
      background: white;
      color: #075526;
      padding: 9px 15px;
      font-weight: bold;
    }

    .banner-fruit {
      position: absolute;
      left: 12px;
      bottom: 9px;
      font-size: 37px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px;
      margin-bottom: 13px;
    }

    .section-title h2 {
      font-size: 17px;
    }

    .section-title button {
      border: 0;
      background: transparent;
      color: #16813a;
      font-size: 12px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      padding: 0 17px;
      margin-bottom: 24px;
    }

    .category {
      border: 1px solid #e8eee7;
      background: white;
      border-radius: 13px;
      padding: 12px 3px;
      font-size: 11px;
      color: #36483a;
    }

    .category .emoji {
      display: block;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 17px 20px;
    }

    .product {
      border: 1px solid #e8eee7;
      border-radius: 15px;
      padding: 10px;
      background: white;
      position: relative;
    }

    .product-img {
      height: 115px;
      border-radius: 12px;
      background: #f3f8ed;
      display: grid;
      place-items: center;
      font-size: 55px;
      margin-bottom: 10px;
    }

    .product h3 {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .product small {
      color: #89948a;
      font-size: 11px;
    }

    .price {
      color: #075526;
      font-weight: bold;
      font-size: 14px;
      margin: 9px 0;
    }

    .add-btn {
      width: 100%;
      border: 0;
      background: #eaf5e9;
      color: #16813a;
      padding: 10px;
      border-radius: 9px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      height: 70px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: white;
      border-top: 1px solid #e8eee7;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #879188;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-item span {
      font-size: 21px;
    }

    .nav-item.active {
      color: #16813a;
      font-weight: bold;
    }

    /* نافذة السلة */
    .cart-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: #0007;
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }

    .cart-box {
      width: min(480px, 100%);
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 22px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-box h2 {
      margin-bottom: 15px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .cart-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cart-actions button {
      border: 0;
      background: #eaf5e9;
      color: #16813a;
      width: 27px;
      height: 27px;
      border-radius: 7px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      padding: 17px 0;
    }

    .close-cart {
      border: 0;
      background: #f1f3f1;
      padding: 10px 14px;
      border-radius: 9px;
    }

    @media (min-width: 600px) {
      body {
        padding-top: 20px;
      }
      .app {
        border-radius: 18px;
        overflow: hidden;
      }
      .bottom-nav {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="logo"><span>🌿</span>طازة</div>
    <button class="header-btn" onclick="openCart()" aria-label="السلة">🛒 <b id="cartCount">0</b></button>
  </header>

  <div class="location">📍 التوصيل إلى: حدّد عنوانك</div>

  <div class="search">
    🔍
    <input id="searchInput" type="search" placeholder="بتدور على إيه؟" oninput="showProducts()">
  </div>

  <section class="banner">
    <h1>طازة كل يوم 🌱<br>من المزرعة لحد باب بيتك</h1>
    <p>خضار وفاكهة مختارة بعناية</p>
    <button onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">
      تسوّق الآن ←
    </button>
    <div class="banner-fruit">🍊 🍓</div>
  </section>

  <div class="section-title">
    <h2>الأقسام</h2>
    <button onclick="filterProducts('الكل')">عرض الكل</button>
  </div>

  <div class="categories">
    <button class="category" onclick="filterProducts('فاكهة')">
      <span class="emoji">🍎</span>الفاكهة
    </button>
    <button class="category" onclick="filterProducts('خضار')">
      <span class="emoji">🥦</span>الخضار
    </button>
    <button class="category" onclick="filterProducts('عروض')">
      <span class="emoji">🏷️</span>العروض
    </button>
    <button class="category" onclick="alert('هنضيف صفحة المفضلة في الخطوة الجاية')">
      <span class="emoji">❤️</span>المفضلة
    </button>
  </div>

  <div class="section-title" id="productsSection">
    <h2 id="productsTitle">منتجات طازة</h2>
    <button onclick="filterProducts('الكل')">كل المنتجات</button>
  </div>

  <div class="products" id="productsGrid"></div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="goHome()"><span>⌂</span>الرئيسية</button>
  <button class="nav-item" onclick="alert('هنعمل صفحة الأقسام بعد ما نخلص الرئيسية')"><span>▦</span>الأقسام</button>
  <button class="nav-item" onclick="openCart()"><span>🛒</span>السلة</button>
  <button class="nav-item" onclick="alert('هنضيف المفضلة في خطوة منفصلة')"><span>♡</span>المفضلة</button>
  <button class="nav-item" onclick="alert('هنعمل صفحة الحساب بعدين')"><span>♙</span>حسابي</button>
</nav>

<div class="cart-panel" id="cartPanel" onclick="if(event.target===this)closeCart()">
  <div class="cart-box">
    <h2>🛒 سلة طازة</h2>
    <div id="cartItems"></div>
    <div class="cart-total"><span>الإجمالي</span><span id="cartTotal">0 جنيه</span></div>
    <button class="add-btn" onclick="alert('هنبني صفحة إتمام الطلب في الخطوة القادمة')">إتمام الطلب</button>
    <br><br>
    <button class="close-cart" onclick="closeCart()">إغلاق</button>
  </div>
</div>

<script>
  // منتجات تجريبية؛ نقدر نغيّرها أو نزودها بعدين
  const products = [
    {id:1,name:"مانجو",emoji:"🥭",price:55,unit:"كيلو",category:"فاكهة"},
    {id:2,name:"فراولة",emoji:"🍓",price:40,unit:"علبة",category:"فاكهة"},
    {id:3,name:"موز",emoji:"🍌",price:25,unit:"كيلو",category:"فاكهة"},
    {id:4,name:"برتقال",emoji:"🍊",price:22,unit:"كيلو",category:"فاكهة"},
    {id:5,name:"تفاح",emoji:"🍎",price:45,unit:"كيلو",category:"فاكهة"},
    {id:6,name:"عنب",emoji:"🍇",price:35,unit:"كيلو",category:"فاكهة"},
    {id:7,name:"طماطم",emoji:"🍅",price:15,unit:"كيلو",category:"خضار"},
    {id:8,name:"خيار",emoji:"🥒",price:18,unit:"كيلو",category:"خضار"},
    {id:9,name:"بطاطس",emoji:"🥔",price:20,unit:"كيلو",category:"خضار"},
    {id:10,name:"بصل",emoji:"🧅",price:16,unit:"كيلو",category:"خضار"},
    {id:11,name:"جزر",emoji:"🥕",price:18,unit:"كيلو",category:"خضار"},
    {id:12,name:"خس",emoji:"🥬",price:12,unit:"واحدة",category:"خضار"}
  ];

  let cart = {};
  let currentFilter = "الكل";

  function showProducts() {
    const query = document.getElementById("searchInput").value.trim();
    const filtered = products.filter(p =>
      (currentFilter === "الكل" || currentFilter === "عروض" || p.category === currentFilter) &&
      p.name.includes(query)
    );

    document.getElementById("productsGrid").innerHTML = filtered.map(p => `
      <article class="product">
        <div class="product-img">${p.emoji}</div>
        <h3>${p.name}</h3>
        <small>طازة • ${p.unit}</small>
        <div class="price">${p.price} جنيه</div>
        <button class="add-btn" onclick="addToCart(${p.id})">＋ أضف للسلة</button>
      </article>
    `).join("") || "<p>مفيش منتجات مطابقة للبحث.</p>";
  }

  function filterProducts(category) {
    currentFilter = category;
    document.getElementById("productsTitle").textContent =
      category === "الكل" ? "منتجات طازة" : category;
    showProducts();
    document.getElementById("productsSection").scrollIntoView({behavior:"smooth"});
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCart();
  }

  function updateCart() {
    const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
    document.getElementById("cartCount").textContent = count;

    const rows = Object.entries(cart);
    document.getElementById("cartItems").innerHTML = rows.length
      ? rows.map(([id, qty]) => {
          const p = products.find(item => item.id === Number(id));
          return `
            <div class="cart-row">
              <span>${p.emoji} ${p.name}<br>${p.price} جنيه</span>
              <div class="cart-actions">
                <button onclick="changeQty(${id},-1)">−</button>
                <span>${qty}</span>
                <button onclick="changeQty(${id},1)">＋</button>
              </div>
            </div>`;
        }).join("")
      : "<p>السلة لسه فاضية، اختار منتجات الأول.</p>";

    const total = rows.reduce((sum, [id, qty]) => {
      return sum + products.find(p => p.id === Number(id)).price * qty;
    }, 0);

    document.getElementById("cartTotal").textContent = total + " جنيه";
  }

  function changeQty(id, change) {
    cart[id] = (cart[id] || 0) + change;
    if (cart[id] <= 0) delete cart[id];
    updateCart();
  }

  function openCart() {
    updateCart();
    document.getElementById("cartPanel").style.display = "flex";
  }

  function closeCart() {
    document.getElementById("cartPanel").style.display = "none";
  }

  function goHome() {
    window.scrollTo({top:0,behavior:"smooth"});
  }

  showProducts();
  updateCart();
</script>
</body>
  </html>
